<script>
(function () {
  var data = JSON.parse(document.getElementById('plant-care-data').textContent);
  var modal = document.getElementById('plant-modal');
  var titleEl = document.getElementById('modal-title');
  var statusEl = document.getElementById('modal-status');
  var careEl = document.getElementById('modal-care');
  var closeBtn = document.getElementById('modal-close');

  function openModal(slug) {
    var p = data[slug];
    if (!p) return;
    titleEl.textContent = p.title;
    statusEl.textContent = p.status;
    statusEl.className = 'modal__status modal__status--' + p.statusKey;
    careEl.innerHTML = '';
    p.fields.forEach(function (f) {
      if (!f.value) return;
      var dt = document.createElement('dt');
      dt.textContent = f.label;
      var dd = document.createElement('dd');
      dd.textContent = f.value;
      careEl.appendChild(dt);
      careEl.appendChild(dd);
    });
    modal.hidden = false;
    document.body.classList.add('modal-open');
  }

  function closeModal() {
    modal.hidden = true;
    document.body.classList.remove('modal-open');
  }

  document.querySelectorAll('.plant').forEach(function (fig) {
    fig.querySelector('img').addEventListener('click', function () {
      openModal(fig.dataset.plant);
    });
  });
  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) {
    if (e.target === modal) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modal.hidden) closeModal();
  });
})();
</script>
